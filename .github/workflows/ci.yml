name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  ci:
    uses: Specter099/.github/.github/workflows/python-ci.yml@main
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    with:
      python-versions: '["3.10","3.11","3.12"]'
      install-command: "pip install -e . pytest ruff"

