name: Stale issues and PRs

on:
  schedule:
    - cron: "0 6 * * *"

permissions: {}

jobs:
  stale:
    uses: Specter099/.github/.github/workflows/stale.yml@main
    permissions:
      issues: write
      pull-requests: write
    with:
      days-before-issue-stale: 60
      days-before-pr-stale: 30
      days-before-close: 14
      exempt-labels: "pinned,security"
