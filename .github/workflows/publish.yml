name: Publish

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    # Test + build live in the shared workflow. Publishing MUST stay in this
    # file: PyPI Trusted Publishing checks job_workflow_ref, which would name
    # the reusable workflow if the publish job ran there.
    uses: Specter099/.github/.github/workflows/python-build.yml@main
    permissions:
      contents: read
    with:
      python-versions: '["3.10","3.11","3.12"]'
      install-command: 'pip install -e . pytest'
      test-command: 'pytest'

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aws-assume-cli/
    permissions:
      id-token: write  # OIDC trusted publisher
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
